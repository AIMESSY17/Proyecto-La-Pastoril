<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f4ebd6" />
    <title>Tu pedido · La Pastoril</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="preload" href="../fuentes/karla-variable.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Página chica y liviana: mismos colores, tipografías y radios que la tienda. */
      @font-face { font-family: "Karla"; src: url("../fuentes/karla-variable.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
      @font-face { font-family: "Arbutus Slab"; src: url("../fuentes/arbutus-slab-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
      :root { --bg: #f4ebd6; --paper: #fffdf7; --ink: #2c3722; --muted: #566049; --olive-dark: #3e4a30; --gold: #e0a526; --soil: #7a4b2a; --border: rgba(122, 75, 42, 0.3); }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); font-family: "Karla", system-ui, sans-serif; line-height: 1.5; color: var(--ink); background: var(--bg); }
      h1, h2 { font-family: "Arbutus Slab", Georgia, serif; font-weight: 400; line-height: 1.2; margin: 0; }
      h1 { font-size: 1.6rem; }
      p { margin: 0; }
      [hidden] { display: none !important; }
      .card { width: min(480px, 100%); display: flex; flex-direction: column; gap: 1rem; padding: 1.5rem; border-radius: 24px; background: var(--paper); border: 1px solid var(--border); outline: 1px dashed rgba(122, 75, 42, 0.16); outline-offset: -8px; box-shadow: 0 1px 0 rgba(122, 75, 42, 0.15), 0 10px 24px rgba(122, 75, 42, 0.1); }
      .brand { display: flex; align-items: center; gap: 0.7rem; font-family: "Arbutus Slab", Georgia, serif; font-size: 1.1rem; }
      .brand-mark { display: grid; place-items: center; width: 44px; height: 44px; border: 1.5px solid var(--border); border-radius: 4px; background: linear-gradient(135deg, #fffdf7, #f0cf86); color: #3e4a30; }
      .muted { color: var(--muted); }
      .view { display: flex; flex-direction: column; gap: 1rem; }
      .items { list-style: none; margin: 0; padding: 0.7rem 0; display: grid; gap: 0.3rem; border-top: 1px dashed var(--border); border-bottom: 1px dashed var(--border); }
      .items li, .total { display: flex; justify-content: space-between; gap: 1rem; }
      .total { font-size: 1.15rem; }
      fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
      legend, .label { padding: 0; font-weight: 700; margin-bottom: 0.3rem; display: block; }
      .stars { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 0.15rem; }
      .stars input { position: absolute; opacity: 0; width: 1px; height: 1px; }
      .stars label { display: grid; place-items: center; width: 48px; height: 48px; color: #8a846c; cursor: pointer; }
      .stars svg { width: 38px; height: 38px; fill: currentColor; }
      /* Las estrellas están en orden inverso para poder pintar "esta y las anteriores" solo con CSS. */
      .stars input:checked ~ label, .stars label:hover, .stars label:hover ~ label { color: #a86f00; }
      .stars input:focus-visible + label { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
      input[type="text"], textarea { width: 100%; min-height: 48px; padding: 0.75rem 0.85rem; border-radius: 4px; border: 1.5px solid var(--border); background: #fff; color: var(--ink); font: inherit; }
      textarea { min-height: 96px; resize: vertical; }
      .check { display: flex; gap: 0.6rem; align-items: flex-start; }
      .check input { flex: none; width: 1.3rem; height: 1.3rem; margin-top: 0.15rem; accent-color: var(--olive-dark); }
      .btn { display: inline-flex; justify-content: center; align-items: center; min-height: 52px; padding: 0.7rem 1.2rem; border: 0; border-radius: 4px; background: var(--gold); color: #2b2000; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
      .btn:disabled { opacity: 0.6; cursor: progress; }
      .btn-secondary { background: var(--olive-dark); color: #fffdf7; }
      .error { padding: 0.7rem 0.9rem; border-radius: 14px; background: #fbe3dc; color: #7a2412; font-weight: 700; }
      .big { width: 72px; height: 72px; }
      .big svg { width: 100%; height: 100%; }
      .sprite { position: absolute; }
      :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
      a { color: inherit; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
    <script src="../config.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script type="module" src="pedido.js"></script>
  </head>
  <body>
    <svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
      <symbol id="p-egg" viewBox="0 0 100 130"><path d="M50 4C26 4 8 48 8 78c0 28 19 48 42 48s42-20 42-48C92 48 74 4 50 4Z" fill="#fffdf7" stroke="#7a4b2a" stroke-width="2.5" /><ellipse cx="31" cy="40" rx="6.5" ry="13" transform="rotate(24 31 40)" fill="#fff" opacity=".75" /></symbol>
      <symbol id="p-hen" viewBox="0 0 96 96"><path d="M22 60c-9-6-13-16-12-27 6 3 11 4 16 2 5-10 15-17 27-17 4-8 12-11 19-8-3 3-3 7-1 10 9 6 14 16 14 27 0 17-13 29-33 29-12 0-23-5-30-16Z" fill="#fffdf7" stroke="#7a4b2a" stroke-width="2.5" stroke-linejoin="round" /><path d="M60 16c1-6 5-9 9-8-1 3 0 5 2 7m0 0c3-4 8-4 10-1-3 1-4 3-4 6" fill="#c9482f" stroke="#7a4b2a" stroke-width="2" stroke-linejoin="round" /><path d="M84 32l9 3-9 4Z" fill="#e0a526" stroke="#7a4b2a" stroke-width="2" stroke-linejoin="round" /><circle cx="74" cy="29" r="2.2" fill="#2c3722" /><path d="M34 52c6 8 18 9 26 2" fill="none" stroke="#7a4b2a" stroke-width="2.5" stroke-linecap="round" /><path d="M44 76v12m-6 0h12m10-13v13m-6 0h12" fill="none" stroke="#e0a526" stroke-width="3" stroke-linecap="round" /></symbol>
      <symbol id="p-signal" viewBox="0 0 24 24"><path d="M3 9a13 13 0 0 1 18 0M6.5 12.5a8 8 0 0 1 11 0M10 16a3 3 0 0 1 4 0M4 4l16 16" fill="none" stroke="#7a4b2a" stroke-width="1.8" stroke-linecap="round" /><circle cx="12" cy="19" r="1" fill="#7a4b2a" /></symbol>
      <symbol id="p-star" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.900.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9Z" /></symbol>
    </svg>
    <main class="card">
      <div class="brand"><span class="brand-mark" aria-hidden="true">LP</span> La Pastoril</div>

      <!-- Cargando -->
      <section class="view" id="viewLoading" aria-live="polite">
        <p class="muted">Buscando tu pedido…</p>
      </section>

      <!-- Enlace inválido, pedido cancelado o ya confirmado -->
      <section class="view" id="viewMessage" hidden>
        <p class="big" id="messageIcon" aria-hidden="true"><svg focusable="false"><use href="#p-egg" /></svg></p>
        <h1 id="messageTitle"></h1>
        <p id="messageText"></p>
        <a class="btn btn-secondary" href="../">Ir a la tienda</a>
      </section>

      <!-- Resumen + confirmación -->
      <section class="view" id="viewOrder" hidden>
        <div>
          <h1 id="orderGreeting"></h1>
          <p class="muted" id="orderNumber"></p>
        </div>
        <ul class="items" id="orderItems"></ul>
        <p class="total"><span>Total</span><strong id="orderTotal"></strong></p>

        <form class="view" id="confirmForm" novalidate>
          <fieldset>
            <legend>¿Cómo estuvo? <span class="muted">(opcional)</span></legend>
            <div class="stars">
              <input type="radio" name="stars" id="star5" value="5" /><label for="star5" title="5 estrellas"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#p-star" /></svg><span class="sr">5 estrellas</span></label>
              <input type="radio" name="stars" id="star4" value="4" /><label for="star4" title="4 estrellas"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#p-star" /></svg><span class="sr">4 estrellas</span></label>
              <input type="radio" name="stars" id="star3" value="3" /><label for="star3" title="3 estrellas"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#p-star" /></svg><span class="sr">3 estrellas</span></label>
              <input type="radio" name="stars" id="star2" value="2" /><label for="star2" title="2 estrellas"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#p-star" /></svg><span class="sr">2 estrellas</span></label>
              <input type="radio" name="stars" id="star1" value="1" /><label for="star1" title="1 estrella"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#p-star" /></svg><span class="sr">1 estrella</span></label>
            </div>
          </fieldset>
          <label>
            <span class="label">Comentario <span class="muted">(opcional)</span></span>
            <textarea id="comment" maxlength="500" placeholder="Contanos qué te parecieron los huevos"></textarea>
          </label>
          <label>
            <span class="label">Tu barrio <span class="muted">(opcional)</span></span>
            <input type="text" id="neighborhood" maxlength="60" placeholder="Ej: Temperley" />
          </label>
          <label class="check">
            <input type="checkbox" id="authorize" />
            <span>Autorizo que se muestre mi comentario en la web con mi nombre de pila y mi barrio.</span>
          </label>
          <p class="error" id="formError" role="alert" hidden></p>
          <button class="btn" type="submit" id="confirmButton">Ya recibí mi pedido</button>
          <p class="muted" style="font-size: 0.88rem;">Tus datos se usan como explica la <a href="../privacidad.html">política de privacidad</a>.</p>
        </form>
      </section>

      <!-- Gracias -->
      <section class="view" id="viewThanks" hidden>
        <p class="big" aria-hidden="true"><svg focusable="false"><use href="#p-hen" /></svg></p>
        <h1>¡Gracias!</h1>
        <p id="thanksText">Registramos que recibiste tu pedido.</p>
        <a class="btn" href="../">Volver a la tienda</a>
      </section>
    </main>
  </body>
</html>
